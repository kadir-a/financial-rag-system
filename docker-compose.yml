services:
  # 1. CORE ENGINE (FastAPI Backend)
  backend:
    build: .
    container_name: finsight_backend
    # Initialize the REST API on port 8000
    command: sh docker/backend.sh
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Persistent storage mappings to prevent data loss and resolve file locks
      - ./data/chroma_db:/app/data/chroma_db
      - ./data/temp_uploads:/app/data/temp_uploads
    env_file:
      - .env
    restart: unless-stopped

  # 2. CLIENT INTERFACE (Streamlit Frontend)
  frontend:
    build: .
    container_name: finsight_frontend
    # Initialize the UI on port 8501
    command: python -m streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend # Ensure the backend is fully operational before launching the frontend
    env_file:
      - .env
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
